name: Base120 CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror-guard:
    runs-on: [self-hosted, Linux, X64, wsl, base120]
    steps:
      - actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Enforce mirror corpus compliance
        run: |
          if [ -d mirrors ] && [ "$(ls -A mirrors | wc -l)" -gt 1 ]; then
            echo "Mirror implementations must validate against corpus"
          fi

  test:
    runs-on: [self-hosted, Linux, X64, wsl, base120]
    steps:
      - actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest
