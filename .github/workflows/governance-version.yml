name: Governance Version Policy

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-policy:
    name: Enforce Version Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Detect version
        id: version
        run: |
          # Get version from pyproject.toml
          VERSION=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

          # Check if v1.0.x
          if [[ "$VERSION" =~ ^1\.0\. ]]; then
            echo "is_v1_0_x=true" >> $GITHUB_OUTPUT
            echo "This is a v1.0.x release (frozen specification)"
          else
            echo "is_v1_0_x=false" >> $GITHUB_OUTPUT
            echo "This is not a v1.0.x release"
          fi

      - name: Check v1.0.x prohibited changes
        id: check_violations
        if: steps.version.outputs.is_v1_0_x == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "v1.0.x Version Policy Enforcement"
          echo "===================================="
          echo ""
          echo "Version: $VERSION"
          echo "Policy: Frozen specification"
          echo ""

          # Get changed files
          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # Initialize violation flag
          VIOLATIONS=""
          REGISTRY_SEMANTIC_VIOLATION="false"

          # Check for schema modifications
          if echo "$CHANGED_FILES" | grep -qE "^schemas/v1\.0\.0/.*\.json$"; then
            VIOLATIONS="${VIOLATIONS}PROHIBITED: Schema modifications detected\n"
            VIOLATIONS="${VIOLATIONS}   Files: $(echo "$CHANGED_FILES" | grep -E '^schemas/v1\.0\.0/')\n"
            VIOLATIONS="${VIOLATIONS}   Policy: Schema changes prohibited in v1.0.x\n\n"
          fi

          # Check for registry modifications - validate if metadata-only
          if echo "$CHANGED_FILES" | grep -qE "^registries/.*\.json$"; then
            echo "Registry changes detected - validating metadata-only compliance..."
            echo ""

            # Export files for comparison
            git show "origin/$BASE_REF:registries/fm.json" > /tmp/fm_before.json
            git show HEAD:registries/fm.json > /tmp/fm_after.json

            # Validate metadata-only changes
            if python scripts/validate_registry_metadata.py /tmp/fm_before.json /tmp/fm_after.json; then
              echo ""
              echo "Registry changes are metadata-only (permitted in v1.0.x)"
            else
              VIOLATIONS="${VIOLATIONS}PROHIBITED: Registry semantic modifications detected\n"
              VIOLATIONS="${VIOLATIONS}   Files: $(echo "$CHANGED_FILES" | grep -E '^registries/')\n"
              VIOLATIONS="${VIOLATIONS}   Policy: Only metadata additions permitted in v1.0.x\n\n"
              REGISTRY_SEMANTIC_VIOLATION="true"
            fi
          fi

          # Check for validator semantic changes
          if echo "$CHANGED_FILES" | grep -qE "base120/validators/(mappings|errors|validate)\.py"; then
            # Check if changes are semantic (more complex check needed)
            VIOLATIONS="${VIOLATIONS}WARNING: Validator logic changes detected\n"
            VIOLATIONS="${VIOLATIONS}   Files: $(echo "$CHANGED_FILES" | grep -E 'base120/validators/')\n"
            VIOLATIONS="${VIOLATIONS}   Policy: Semantic changes prohibited in v1.0.x\n"
            VIOLATIONS="${VIOLATIONS}   Action: Verify changes are security fixes or non-semantic\n\n"
          fi

          # Report violations
          if [ -n "$VIOLATIONS" ]; then
            echo "GOVERNANCE VIOLATIONS DETECTED"
            echo "=============================="
            echo ""
            echo -e "$VIOLATIONS"
            echo "v1.0.x Permitted Changes:"
            echo "  - Security fixes (with audit)"
            echo "  - CI hardening (with audit)"
            echo "  - Documentation clarifications"
            echo "  - Corpus additions (with audit)"
            echo "  - FM lifecycle metadata additions (forward compatibility)"
            echo ""
            echo "v1.0.x Prohibited Changes:"
            echo "  - Schema modifications"
            echo "  - Registry semantic modifications (new FMs, ID/name changes)"
            echo "  - Semantic validator changes"
            echo "  - Breaking changes"
            echo ""
            echo "See GOVERNANCE.md Section: Version Policy"
            echo ""
            echo "If you believe this is a false positive, please:"
            echo "  1. Add justification to PR description"
            echo "  2. Request governance override"
            echo "  3. Tag @hummbl-dev for review"

            # Check if violations include hard prohibitions (schemas or semantic registry changes)
            if echo "$CHANGED_FILES" | grep -qE "^schemas/v1\.0\.0/.*\.json$"; then
              echo ""
              echo "HARD FAILURE: Schema changes are prohibited in v1.0.x"
              echo "This PR cannot be merged without governance override."
              exit 1
            fi

            if [ "$REGISTRY_SEMANTIC_VIOLATION" == "true" ]; then
              echo ""
              echo "HARD FAILURE: Registry semantic changes are prohibited in v1.0.x"
              echo "Metadata-only additions are permitted. See GOVERNANCE.md."
              exit 1
            fi

            echo ""
            echo "SOFT WARNING: Manual review required"
            echo "CODEOWNER must verify changes are permitted."
          else
            echo "PASS: No v1.0.x policy violations detected"
            echo ""
            echo "All changes appear to be permitted under v1.0.x policy:"
            echo "  - No schema modifications"
            echo "  - No registry semantic modifications"
            echo "  - No prohibited semantic changes"
          fi

      - name: Check for corpus-only additions
        if: steps.version.outputs.is_v1_0_x == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"

          # Check if corpus files were modified (not added)
          MODIFIED_CORPUS=$(git diff --name-status "origin/$BASE_REF...HEAD" | grep -E "^M.*tests/corpus/(valid|invalid)/.*\.json$" || true)

          if [ -n "$MODIFIED_CORPUS" ]; then
            echo "WARNING: Existing corpus files modified"
            echo "Files:"
            echo "$MODIFIED_CORPUS"
            echo ""
            echo "Corpus modifications require:"
            echo "  - Justification in PR description"
            echo "  - 1+ external reviewer approval"
            echo "  - Verification that change is valid"
          else
            # Check for additions
            ADDED_CORPUS=$(git diff --name-status "origin/$BASE_REF...HEAD" | grep -E "^A.*tests/corpus/(valid|invalid)/.*\.json$" || true)

            if [ -n "$ADDED_CORPUS" ]; then
              echo "Corpus additions detected (permitted in v1.0.x)"
              echo "Files:"
              echo "$ADDED_CORPUS"
            fi
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_V1_0_X: ${{ steps.version.outputs.is_v1_0_x }}
        run: |
          echo "Version Policy Check Summary"
          echo "==============================="
          echo "Version: $VERSION"
          echo "v1.0.x: $IS_V1_0_X"
          echo ""
          if [ "$IS_V1_0_X" == "true" ]; then
            echo "Policy: Frozen specification (v1.0.x)"
            echo "Enforcement: Active"
          else
            echo "Policy: Standard governance rules apply"
            echo "Enforcement: Change class based"
          fi
